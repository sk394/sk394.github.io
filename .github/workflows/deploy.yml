name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 15 minutes: rebuild only if the Notion content changed (cheap hash check).
    - cron: "*/15 * * * *"
    # Daily forced rebuild, so "present" durations and logo fetches stay fresh.
    - cron: "17 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
  NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - id: diff
        name: Did the content change?
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "17 6 * * *" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          npm ci --no-audit --no-fund
          NEW=$(npm run -s content:check | tail -n1)
          OLD=$(curl -fsSL "${{ steps.pages.outputs.base_url }}/content-version.txt" 2>/dev/null | tr -d '[:space:]' || echo none)
          echo "live=$OLD notion=$NEW"
          if [ "$NEW" = "unconfigured" ] || [ "$NEW" = "unreachable" ] || [ "$NEW" = "$OLD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci --no-audit --no-fund
      - name: Fetch content from Notion
        run: npm run content
      - name: Fetch missing logos
        run: npm run logos
        continue-on-error: true
      - name: Build
        run: npm run build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
